services:
  db:
    image: mysql:8.4
    container_name: salada-mix-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: salada_mix
      MYSQL_USER: salada_mix
      MYSQL_PASSWORD: local-dev-only
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -plocal-root-only"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  mysql_data:

