# Identificação do projeto é passada pelo workflow a partir de GitHub Variables.
# Não inventar sonar.projectKey ou sonar.organization: copiar do projeto importado.
sonar.projectName=Salada Mix 2.0
sonar.sourceEncoding=UTF-8
sonar.sources=app,bootstrap,config,database,routes,resources,preview,infrastructure
sonar.tests=tests,preview/tests
# Evita analisar duas vezes o CSS e os SVG oficiais copiados para a preview.
sonar.exclusions=preview/tests/**,preview/assets/salada-foundation.css,preview/assets/salada-catalog.css,preview/assets/salada/**
sonar.php.coverage.reportPaths=coverage/sonar-clover.xml
# Cobertura automatizada inicial: PHP aplicativo. Blade/CSS/JS e infraestrutura seguem
# sob análise estática, mas não entram no percentual até testes frontend com LCOV.
sonar.coverage.exclusions=bootstrap/**,config/**,database/migrations/**,database/seeders/**,routes/**,resources/**,preview/**,infrastructure/**
