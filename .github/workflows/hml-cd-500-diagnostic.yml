name: Diagnostico HML - cache do release
on:
  push:
    branches: [fix/hml-cd-500]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: homologacao
    env:
      HOST: ${{ secrets.HML_SSH_HOST }}
      PORT: ${{ secrets.HML_SSH_PORT }}
      USER: ${{ secrets.HML_SSH_USER }}
      KEY: ${{ secrets.HML_SSH_PRIVATE_KEY }}
      KNOWN: ${{ secrets.HML_SSH_KNOWN_HOSTS }}
    steps:
      - name: Verificar caminhos de cache sem exibir credenciais
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/hml_key"
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hml_key" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/hml_key" -p "$PORT" \
            "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -eu
          root="$HOME/apps/salada-mix-hml"
          bad="$root/releases/failed-a68f9036136e1ca18adc20bb5afca62468d09cdf-36636660300"
          test -f "$bad/bootstrap/cache/config.php"
          BAD="$bad" php -r '
          $conf=require getenv("BAD")."/bootstrap/cache/config.php";
          foreach (["view", "logging", "cache"] as $k) {
            $v = $k==="view" ? ($conf["view"]["compiled"]??"")
               : ($k==="logging" ? ($conf["logging"]["channels"]["single"]["path"]??"")
               : ($conf["cache"]["stores"]["file"]["path"]??""));
            if (str_contains((string)$v, "/releases/")) echo $k.": stale release path\n";
            elseif (str_contains((string)$v, "/current/")) echo $k.": current path\n";
            else echo $k.": other path\n";
          }
          '
          for p in "$bad" "$bad/bootstrap/cache" "$root/shared" "$root/shared/storage"; do
            stat -Lc '%a %n' "$p"
          done
          echo "Current SHA: $(cat "$root/deployed_commit.txt")"
          REMOTE
