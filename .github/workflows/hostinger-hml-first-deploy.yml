name: Hostinger HML - primeira publicacao Laravel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hostinger-hml-first-deploy.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: salada-hml-first-deploy
  cancel-in-progress: false

jobs:
  release:
    name: Validar, compilar e instalar primeiro release HML
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: homologacao
    env:
      HML_SSH_HOST: ${{ secrets.HML_SSH_HOST }}
      HML_SSH_PORT: ${{ secrets.HML_SSH_PORT }}
      HML_SSH_USER: ${{ secrets.HML_SSH_USER }}
      HML_SSH_PRIVATE_KEY: ${{ secrets.HML_SSH_PRIVATE_KEY }}
      HML_SSH_KNOWN_HOSTS: ${{ secrets.HML_SSH_KNOWN_HOSTS }}
      HML_DB_PASSWORD: ${{ secrets.HML_DB_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Restringir destino e validar os segredos
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          for name in HML_SSH_HOST HML_SSH_PORT HML_SSH_USER HML_SSH_PRIVATE_KEY HML_SSH_KNOWN_HOSTS HML_DB_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Configuração ausente::Secret $name não foi encontrado."
              exit 1
            fi
          done
          [[ "$HML_SSH_PORT" =~ ^[0-9]+$ ]]

      - name: Aguardar qualidade e SonarQube verdes para ESTE commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 35); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100")"
            quality="$(jq -r '[.workflow_runs[] | select(.name == "Qualidade Salada Mix")] | first | .conclusion // "pending"' <<< "$runs")"
            sonar="$(jq -r '[.workflow_runs[] | select(.name == "SonarQube Cloud")] | first | .conclusion // "pending"' <<< "$runs")"
            echo "Quality: $quality; SonarQube: $sonar"
            if [[ "$quality" == success && "$sonar" == success ]]; then
              break
            fi
            case "$quality/$sonar" in
              *failure*|*cancelled*|*timed_out*|*action_required*)
                echo "::error::Quality Gate ou testes falharam; publicação bloqueada."
                exit 1 ;;
            esac
            if [[ "$attempt" == 35 ]]; then
              echo "::error::Testes e Sonar não concluíram dentro do prazo."
              exit 1
            fi
            sleep 20
          done

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, intl, zip, dom, fileinfo
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar release reproduzivel sem credenciais
        shell: bash
        run: |
          set -euo pipefail
          test -s composer.lock
          test -s package-lock.json
          composer validate --no-check-publish --strict
          composer install --no-dev --no-interaction --prefer-dist --no-progress --no-scripts --optimize-autoloader
          npm ci --no-audit --no-fund
          npm run build
          test -s vendor/autoload.php
          test -s public/build/manifest.json
          test ! -f .env
          tar -czf "$RUNNER_TEMP/salada-hml-release.tar.gz" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./tests' \
            --exclude='./preview' \
            --exclude='./coverage' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./.scannerwork' \
            -C "$GITHUB_WORKSPACE" .
          test -s "$RUNNER_TEMP/salada-hml-release.tar.gz"

      - name: Preparar identidade SSH verificada
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HML_SSH_PRIVATE_KEY" > "$HOME/.ssh/salada_hml_deploy"
          printf '%s\n' "$HML_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/salada_hml_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/salada_hml_deploy" > /dev/null

      - name: Confirmar HTTPS e preparar diretorio privado
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSIL --connect-timeout 10 --max-time 30 "https://ivory-rook-276202.hostingersite.com/" > /dev/null
          ssh -F /dev/null -T -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/salada_hml_deploy" -p "$HML_SSH_PORT" \
            "$HML_SSH_USER@$HML_SSH_HOST" \
            'set -eu; test -d "$HOME/domains/ivory-rook-276202.hostingersite.com/public_html"; mkdir -p "$HOME/apps/salada-mix-hml/incoming"; chmod 700 "$HOME/apps/salada-mix-hml/incoming"'

      - name: Enviar pacote e instaladores pelo SSH
        shell: bash
        run: |
          set -euo pipefail
          scp -F /dev/null -B -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/salada_hml_deploy" -P "$HML_SSH_PORT" \
            "$RUNNER_TEMP/salada-hml-release.tar.gz" "$HML_SSH_USER@$HML_SSH_HOST:apps/salada-mix-hml/incoming/release.tar.gz"
          scp -F /dev/null -B -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/salada_hml_deploy" -P "$HML_SSH_PORT" \
            infrastructure/hostinger/prepare-env.php \
            infrastructure/hostinger/first-deploy.sh \
            infrastructure/hostinger/rollback-first.sh \
            "$HML_SSH_USER@$HML_SSH_HOST:apps/salada-mix-hml/incoming/"

      - name: Preparar arquivo de ambiente secreto fora de public_html
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HML_DB_PASSWORD" |
            ssh -F /dev/null -T -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/salada_hml_deploy" -p "$HML_SSH_PORT" \
              "$HML_SSH_USER@$HML_SSH_HOST" \
              'php "$HOME/apps/salada-mix-hml/incoming/prepare-env.php"'

      - name: Migrar banco vazio e instalar Laravel em HML
        shell: bash
        run: |
          set -euo pipefail
          ssh -F /dev/null -T -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/salada_hml_deploy" -p "$HML_SSH_PORT" \
            "$HML_SSH_USER@$HML_SSH_HOST" \
            "bash \"\$HOME/apps/salada-mix-hml/incoming/first-deploy.sh\" '$GITHUB_SHA'"

      - name: Verificar HTTPS, login e bloqueio de indexacao
        shell: bash
        run: |
          set -euo pipefail
          url="https://ivory-rook-276202.hostingersite.com"
          if ! (
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$url/up" > /dev/null &&
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$url/" | grep -q 'Salada Mix' &&
            curl -fsS --connect-timeout 10 --max-time 30 "$url/entrar" > /dev/null &&
            curl -fsS "$url/robots.txt" | grep -q '^Disallow: /' &&
            [[ "$(curl -s -o /dev/null -w '%{http_code}' "$url/.env")" != '200' ]]
          ); then
            echo "::error::Smoke test HTTP reprovado. Restaurando a pagina original."
            ssh -F /dev/null -T -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/salada_hml_deploy" -p "$HML_SSH_PORT" \
              "$HML_SSH_USER@$HML_SSH_HOST" \
              'bash "$HOME/apps/salada-mix-hml/incoming/rollback-first.sh"'
            exit 1
          fi
          echo "HML HTTPS e Laravel confirmados: $url"
