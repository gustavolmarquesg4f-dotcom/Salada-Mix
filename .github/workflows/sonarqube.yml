name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Análise de código e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: salada_mix
          MYSQL_USER: salada_mix
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-only-root"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: salada_mix
      DB_USERNAME: salada_mix
      DB_PASSWORD: ci-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      MARKETPLACE_CHECKOUT_ENABLED: false
    steps:
      - name: Obter o código e o histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exigir conexão SonarQube antes de iniciar análise
        shell: bash
        run: |
          missing=0
          for var in SONAR_TOKEN SONAR_ORGANIZATION SONAR_PROJECT_KEY; do
            if [[ -z "${!var}" ]]; then
              echo "::error title=SonarQube não configurado::$var está ausente. Configure secret e variables conforme docs/runbooks/sonarqube-cloud.md."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Análise SonarQube não executada. Este check deve falhar, nunca exibir verde por skip."
            exit 1
          fi
      - name: Configurar PHP e PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, intl, zip, dom, fileinfo
          coverage: pcov
          tools: composer:v2
      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Preparar banco MySQL de testes
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - name: Executar testes e gerar Clover
        run: |
          mkdir -p coverage
          php artisan test --coverage-clover=coverage/sonar-clover.xml
          test -s coverage/sonar-clover.xml
      - name: Analisar projeto com SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v7.2.1
        with:
          args: >-
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
