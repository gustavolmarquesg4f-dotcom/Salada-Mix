name: Preparar lockfiles do release HML

on:
  push:
    branches: [chore/hostinger-hml-release]
    paths:
      - .github/workflows/prepare-hml-lockfiles.yml

permissions:
  contents: write

jobs:
  lock:
    name: Gerar locks no GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, intl, zip, dom, fileinfo
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar composer.lock e package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/chore/hostinger-hml-release"
          composer install --no-interaction --prefer-dist --no-progress
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          composer validate --no-check-publish
          test -s composer.lock && test -s package-lock.json
      - name: Versionar locks na branch de preparo
        shell: bash
        run: |
          set -euo pipefail
          git add composer.lock package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: pin Composer and npm dependencies for Hostinger HML"
          git push origin HEAD:chore/hostinger-hml-release
