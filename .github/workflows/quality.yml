name: Qualidade Salada Mix

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: salada-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP, migrations, testes e frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: salada_mix
          MYSQL_USER: salada_mix
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-only-root"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: salada_mix
      DB_USERNAME: salada_mix
      DB_PASSWORD: ci-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      MARKETPLACE_CHECKOUT_ENABLED: false
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, intl, zip, dom, fileinfo
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar composer
        run: composer validate --no-check-publish
      - name: Instalar PHP
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Criar ambiente de CI
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Verificar migrations no MySQL
        run: php artisan migrate --force
      - name: Testes automatizados
        run: php artisan test
      - name: Verificar rotas
        run: php artisan route:list
      - name: Build frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
