name: Validar prévia pública

on:
  pull_request:
    paths:
      - 'preview/**'
      - '.github/workflows/preview-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: node --check preview/assets/app.js
      - name: Executar smoke test
        run: node preview/tests/smoke.cjs

