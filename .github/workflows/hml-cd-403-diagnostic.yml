name: Diagnostico HML - 403 da atualizacao
on:
  push:
    branches: [fix/hml-cd-403]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: homologacao
    env:
      HOST: ${{ secrets.HML_SSH_HOST }}
      PORT: ${{ secrets.HML_SSH_PORT }}
      USER: ${{ secrets.HML_SSH_USER }}
      KEY: ${{ secrets.HML_SSH_PRIVATE_KEY }}
      KNOWN: ${{ secrets.HML_SSH_KNOWN_HOSTS }}
      DOMAIN: ivory-rook-276202.hostingersite.com
    steps:
      - name: Conferir release atual e permissoes sem ler segredos
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/hml_key"
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hml_key" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -T -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/hml_key" -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -eu
          root="$HOME/apps/salada-mix-hml"
          web="$HOME/domains/ivory-rook-276202.hostingersite.com/public_html"
          failed="$root/releases/failed-b3c542254bd378affffde7723e67befc6085774f-36635647216"
          for p in "$HOME" "$root" "$root/current" "$root/current/storage" "$root/shared" "$root/shared/storage" "$failed" "$failed/vendor" "$failed/bootstrap" "$failed/bootstrap/cache" "$failed/storage" "$web" "$web/index.php" "$web/.htaccess"; do
            if test -e "$p"; then stat -Lc 'mode=%a user=%U group=%G type=%F path=%n' "$p"; else echo "absent: $p"; fi
          done
          echo "Current SHA: $(cat "$root/deployed_commit.txt")"
          if test -f "$root/.pending-release"; then echo 'Pending release marker: present'; else echo 'Pending release marker: absent'; fi
          command -v flock || true
          command -v mariadb-dump || command -v mysqldump || true
          REMOTE
          for path in / /up /entrar /assets/salada/salada-mix-logo.svg; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 8 --max-time 15 "https://$DOMAIN$path")" || code=NETWORK_ERROR
            echo "Current canonical $path: $code"
          done
